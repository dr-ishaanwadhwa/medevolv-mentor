# MedEvolv Mentor v2 (Next.js + FastAPI). Lives in ~/v2 on the VM, outside eka/ so eka's rsync --delete keeps it.
# Joins eka's network so the existing Caddy (eka-caddy-1) reaches it by service name.
services:
  v2-api:
    build: { context: ., dockerfile: Dockerfile.api }
    env_file: .env                  # DEEPSEEK_API_KEY, ATLAS_URL, LLM_BACKEND, EMBED_BACKEND (+ YOUTUBE_API_KEY, EVENTS_TOKEN,
                                    # DIAGRAM_SIG_SECRET when set locally) (copied by push.sh)
    restart: unless-stopped
    expose: ["8000"]
    # ../v2-state is ~/v2-state on the VM: outside the rsync payload, so push.sh never overwrites the flags. Mounted as a
    # DIRECTORY (read-only) because `mv` over features.json replaces the inode and a single-file bind mount would go stale.
    volumes: [v2_appdb:/home/user/var, "../v2-state:/home/user/v2-state:ro"]
    networks: [eka_default]
  v2-web:
    build: { context: ., dockerfile: Dockerfile.web }
    restart: unless-stopped
    expose: ["3000"]
    environment: { BACKEND_API_URL: "http://v2-api:8000" }
    depends_on: [v2-api]
    networks: [eka_default]
volumes:
  v2_appdb:
networks:
  eka_default:
    external: true
